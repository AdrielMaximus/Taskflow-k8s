apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend
  namespace: dev
  labels:
    app: taskflow
    tier: frontend
spec:
  replicas: 2
  selector: 
    matchLabels:
      app: taskflow
      tier: frontend
  template:
    metadata:
      labels:
        app: taskflow
        tier: frontend
    spec:
      containers:
      - name: taskflow-frontend
        image: adrielmaximus/taskflow-front-end:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
